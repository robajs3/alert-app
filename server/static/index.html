<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel alertów</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1c1e21; --muted:#6b7280; --accent:#2563eb; --border:#d8dce3; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --fg:#e8eaed; --muted:#9aa0a9; --accent:#3b82f6; --border:#343a44; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
  h1 { font-size:20px; margin:0 0 16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 4px; }
  input, textarea, select { width:100%; padding:10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:8px; }
  textarea { min-height:120px; resize:vertical; }
  button { margin-top:18px; width:100%; padding:11px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; }
  #status { margin-top:12px; font-size:14px; min-height:20px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Wyślij alert</h1>
    <label for="target">Odbiorca</label>
    <select id="target"><option value="all">Wszystkie komputery</option></select>
    <label for="title">Tytuł okna</label>
    <input id="title" maxlength="100" value="Alert">
    <label for="text">Treść</label>
    <textarea id="text" maxlength="2000" placeholder="Dowolny tekst…"></textarea>
    <button id="send">Wyślij</button>
    <div id="status"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);

async function loadClients() {
  try {
    const names = await (await fetch('api/clients')).json();
    const cur = $('target').value;
    $('target').replaceChildren(new Option(`Wszystkie komputery (${names.length} online)`, 'all'));
    names.forEach(n => $('target').add(new Option(n, n)));
    if ([...$('target').options].some(o => o.value === cur)) $('target').value = cur;
  } catch (e) {}
}

$('send').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) return;
  $('send').disabled = true;
  const st = $('status');
  try {
    const r = await fetch('api/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title: $('title').value, text, target: $('target').value})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    st.className = d.delivered ? 'ok' : 'err';
    st.textContent = d.delivered ? `Dostarczono do: ${d.delivered}` : 'Brak podłączonych odbiorców.';
  } catch (e) {
    st.className = 'err';
    st.textContent = 'Błąd wysyłania: ' + e.message;
  }
  $('send').disabled = false;
};

loadClients();
setInterval(loadClients, 5000);
</script>
</body>
</html>
